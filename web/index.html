<!doctype html>
<html lang="hu" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Levente Racing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; background: #111; z-index: 30;
    transition: background-color .15s ease;
  }
  /* Kocsi/pálya/ég váltásnál a játék/menü mögötte marad látható (bár állóképként,
     a renderelés eddig is állt ilyenkor) — így legalább nem tűnik el minden. */
  #loading.overlay-translucent { background: rgba(17, 17, 17, .6); }
  
  #menu.hidden, #hud.hidden,
  #raceHudWrap.hidden, #countdown.hidden, #results.hidden { display: none !important; }

  #raceHudWrap { position: fixed; top: 12px; right: 12px; z-index: 10; min-width: 170px; }

  .top-center-alert {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 15;
    pointer-events: none;
  }
  #lapInvalidAlert { top: 12px; }
  #rolloverAlert { top: 70px; }
  .top-center-alert.hidden { display: none !important; }

  #countdown {
    position: fixed; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    font-size: 22vh; font-weight: 800; color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  #results {
    position: fixed; inset: 0; z-index: 26;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
  }

  /* A dev mód saját felületének stílusa a dev.html-ben van — az csak akkor
     kerül be az oldalba, ha valaki tényleg dev módba lép. */
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
  }
  #hud .card { min-width: 220px; }

  #miniMapWrap {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #miniMapCanvas {
    display: block; border-radius: 8px;
    background: rgba(10, 12, 17, 0.6);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #speedReadout {
    color: #fff; font-weight: 700; font-size: 1.1rem;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    background: rgba(10, 12, 17, 0.6);
    padding: 2px 12px; border-radius: 6px;
  }
  #speedReadout span { font-size: 1.4rem; }

  #menu {
    position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 92vw);
    background: rgba(10, 12, 17, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: -24px 0 60px rgba(0, 0, 0, 0.55);
    z-index: 20;
  }

  #menu h1 {
    background: linear-gradient(90deg, #7aa2ff, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .ss-wrap { position: relative; }
  .ss-menu {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    max-height: 280px; overflow-y: auto;
    background: #1c1f26; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; margin-top: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .ss-menu.hidden { display: none; }
  .ss-option { padding: 6px 12px; cursor: pointer; color: #e9ecef; font-size: 0.95rem; }
  .ss-option:hover, .ss-option.active { background: #375a7f; color: #fff; }
  .ss-option.ss-empty { color: #888; cursor: default; }
  .ss-option.ss-selected { font-weight: 600; }
  .ss-option.ss-selected::after { content: ' ✓'; opacity: 0.7; }

  /* Mindig foglalja a helyét (egy sornyi magasság), csak üresen látszik
     átlátszónak — így a "Kocsi/Pálya betöltése..." felirat megjelenése nem
     tolja el a fölötte/alatta lévő elemeket. */
  #menuStatus { min-height: 1.5em; }

/* Többjátékos lobby */
#mpOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 40;
  display: flex; align-items: center; justify-content: center; }
#mpOverlay.hidden { display: none; }
#mpOverlay .mp-panel { background: #1b1f24; color: #eee; padding: 20px 22px;
  border-radius: 10px; width: min(420px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#mpOverlay .hidden { display: none; }
</style>
</head>
<body>
<div id="loading">
  <div class="text-center" style="width: min(320px, 80vw);">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <div id="loadingText">Betöltés...</div>
    <div class="progress mt-3" style="height: 8px;">
      <div id="loadingBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
    </div>
    <div id="loadingPct" class="small text-secondary mt-1">0%</div>
  </div>
</div>

<div id="menu" class="d-flex flex-column justify-content-center p-4 p-md-5">
  <h1 class="fw-bold mb-4">Levente Racing</h1>

  <div class="mb-3">
    <label for="mapSelect" class="form-label text-uppercase small text-secondary">Pálya</label>
    <select id="mapSelect" class="form-select form-select-lg" disabled></select>
  </div>

  <div class="mb-3">
    <label for="carSelect" class="form-label text-uppercase small text-secondary">Kocsi</label>
    <select id="carSelect" class="form-select form-select-lg" disabled></select>
  </div>

  <div class="mb-3">
    <label for="envSelect" class="form-label text-uppercase small text-secondary">Környezet</label>
    <select id="envSelect" class="form-select form-select-lg" disabled></select>
  </div>

  <div class="mb-4">
    <label for="lapCountSelect" class="form-label text-uppercase small text-secondary">Körök száma</label>
    <select id="lapCountSelect" class="form-select form-select-lg">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="5">5</option>
      <option value="10">10</option>
    </select>
  </div>

  <button id="startBtn" class="btn btn-primary btn-lg fw-semibold" disabled>Egyjátékos</button>
  <div id="menuStatus" class="text-center small text-secondary mt-3"></div>
</div>

<div id="hud" class="hidden">
  <div class="card bg-dark bg-opacity-75 border-secondary-subtle text-light">
    <div class="card-body py-2 px-3 small">
      WASD / nyilak: gáz, kormány, fék<br>
      R: autó visszahelyezése<br>
      <a id="backToMenuLink" class="link-info" role="button">Vissza a menübe</a><br>
      <span id="status"></span><br>
      Zóna: <span id="zoneIndicator">aszfalt</span>
    </div>
  </div>

  <div id="miniMapWrap">
    <div id="speedReadout"><span id="speedValue">0</span> km/h</div>
    <canvas id="miniMapCanvas" width="180" height="180"></canvas>
  </div>
</div>

<div id="raceHudWrap" class="hidden">
  <div class="card bg-dark bg-opacity-75 border-secondary-subtle text-light">
    <div class="card-body py-2 px-3 small" id="raceHud"></div>
  </div>
</div>

<div id="lapInvalidAlert" class="top-center-alert hidden">
  <div class="alert alert-warning fw-bold text-center mb-0 shadow" id="lapInvalidAlertText">Kör érvénytelen!</div>
</div>

<div id="rolloverAlert" class="top-center-alert hidden">
  <div class="alert alert-danger fw-bold text-center mb-0 shadow" id="rolloverAlertText"></div>
</div>

<div id="countdown" class="hidden">3</div>

<div id="results" class="hidden">
  <div class="card bg-dark border-primary text-light" style="min-width:280px;">
    <div class="card-body">
      <h5 class="card-title text-primary mb-3">Verseny vége</h5>
      <div id="resultsBody"></div>
      <button id="resultsRestartBtn" class="btn btn-primary btn-sm mt-3">Újra</button>
      <button id="resultsMenuBtn" class="btn btn-secondary btn-sm mt-3">Menü</button>
    </div>
  </div>
</div>

<!-- A dev mód felülete (devHud, autó tesztelő, zóna-szerkesztő) a dev.html-ben
     van: a dev.js kéri le és injektálja be, amikor tényleg dev módba lépsz. -->

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/",
    "rapier": "./vendor/rapier.es.js",
    "three-mesh-bvh": "./vendor/three-mesh-bvh.js"
  }
}
</script>
<script type="module" src="main.js?v=1"></script>
</body>
</html>

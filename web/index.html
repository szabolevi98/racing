<!doctype html>
<html lang="hu" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Levente Racing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="loading">
  <div class="text-center" style="width: min(320px, 80vw);">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <div id="loadingText">Betöltés...</div>
    <div class="progress mt-3" style="height: 6px;">
      <div id="loadingBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
    </div>
    <div id="loadingPct" class="small text-secondary mt-2">0%</div>
  </div>
</div>

<div id="menu">
 <div class="menu-inner p-4 p-md-5">
  <h1>Levente Racing</h1>
  <div class="menu-sub">Körverseny</div>

  <div class="mb-3">
    <label for="mapSelect" class="form-label lbl">Pálya</label>
    <select id="mapSelect" class="form-select" disabled></select>
  </div>

  <div class="mb-3">
    <label for="carSelect" class="form-label lbl">Kocsi</label>
    <select id="carSelect" class="form-select" disabled></select>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-7">
      <label for="envSelect" class="form-label lbl">Környezet</label>
      <select id="envSelect" class="form-select" disabled></select>
    </div>
    <div class="col-5">
      <label for="lapCountSelect" class="form-label lbl">Körök</label>
      <select id="lapCountSelect" class="form-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <button id="startBtn" class="btn-race btn-solo" disabled>Egyjátékos</button>
  <div id="menuStatus" class="text-center mt-3"></div>
 </div>
</div>

<div id="hud" class="hidden">
  <div id="topLeft">
    <div class="tl-bar">
      <div id="backToMenuLink" role="button">← Vissza a menübe</div>
      <button id="helpBtn" type="button" title="Irányítás" aria-label="Irányítás">i</button>
    </div>

    <div id="helpPanel" class="panel hidden">
      <h6>Irányítás</h6>
      <div class="help-row"><span>Gyorsítás</span>
        <span class="help-keys"><kbd class="k">W</kbd><span class="sep">/</span><kbd class="k">↑</kbd></span></div>
      <div class="help-row"><span>Fék / tolatás</span>
        <span class="help-keys"><kbd class="k">S</kbd><span class="sep">/</span><kbd class="k">↓</kbd></span></div>
      <div class="help-row"><span>Kormányzás</span>
        <span class="help-keys"><kbd class="k">A</kbd><kbd class="k">D</kbd>
          <span class="sep">/</span><kbd class="k">←</kbd><kbd class="k">→</kbd></span></div>
      <div class="help-row"><span>Kézifék</span>
        <span class="help-keys"><kbd class="k">Space</kbd></span></div>
      <div class="help-row"><span>Kamera</span>
        <span class="help-keys"><kbd class="k">C</kbd></span></div>
      <div class="help-row"><span>Vissza a pályára</span>
        <span class="help-keys"><kbd class="k">R</kbd></span></div>
      <div class="help-row"><span>Körbenézés</span>
        <span class="help-keys"><kbd class="k">jobb egér</kbd></span></div>
      <div class="help-row"><span>Némítás</span>
        <span class="help-keys"><kbd class="k">M</kbd></span></div>
    </div>

    <div id="standingsWrap" class="hidden">
      <div id="standings" class="panel"></div>
    </div>
  </div>

  <div id="raceHudWrap">
    <div id="raceHud" class="panel"></div>
  </div>

  <div id="miniMapWrap" class="panel">
    <canvas id="miniMapCanvas" width="180" height="180"></canvas>
  </div>

  <div id="speedPanel" class="panel">
    <div class="sp-value">
      <span id="speedValue" class="num">0</span>
      <span class="sp-unit">km/h</span>
    </div>
    <div class="sp-zone"><span id="zoneIndicator" data-zone="asphalt">aszfalt</span></div>
  </div>
</div>

<div id="lapInvalidAlert" class="top-center-alert hidden">
  <div class="alert-pill warn" id="lapInvalidAlertText">Kör érvénytelen!</div>
</div>

<div id="rolloverAlert" class="top-center-alert hidden">
  <div class="alert-pill danger" id="rolloverAlertText"></div>
</div>

<div id="countdown" class="hidden">3</div>

<div id="results" class="hidden">
  <div class="panel results-card">
    <div class="results-title">Verseny vége</div>
    <div id="resultsBody"></div>
    <div class="d-flex gap-2 mt-4">
      <button id="resultsRestartBtn" class="mp-btn primary flex-grow-1">Újra</button>
      <button id="resultsMenuBtn" class="mp-btn ghost">Menü</button>
    </div>
  </div>
</div>

<!-- A dev mód felülete (devHud, autó tesztelő, zóna-szerkesztő) a dev.html-ben
     van: a dev.js kéri le és injektálja be, amikor tényleg dev módba lépsz. -->

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/",
    "rapier": "./vendor/rapier.es.js",
    "three-mesh-bvh": "./vendor/three-mesh-bvh.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>

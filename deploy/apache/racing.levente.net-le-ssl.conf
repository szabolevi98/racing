<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName racing.levente.net

    ErrorLog ${APACHE_LOG_DIR}/racing-error.log
    CustomLog ${APACHE_LOG_DIR}/racing-access.log combined

    # A nagy pályák, autók és textúrák nem érintik a Node eseményhurkát.
    DocumentRoot /opt/racing/web
    Alias /shared/ /opt/racing/shared/

    <Directory /opt/racing/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        FileETag MTime Size
    </Directory>

    <Directory /opt/racing/shared>
        Options -Indexes
        AllowOverride None
        Require all granted
        FileETag MTime Size
    </Directory>

    # A /dev ugyanazt a belépőoldalt használja; a kliens az URL-ből kapcsol
    # fejlesztői módba. Ez a Node statikus kiszolgálójának megfelelője.
    RewriteEngine On
    RewriteRule ^/?dev/?$ /index.html [END]

    # Csak a dinamikus kérések mennek a játékszerverhez.
    ProxyPass        /ws  ws://127.0.0.1:3000/ws
    ProxyPassReverse /ws  ws://127.0.0.1:3000/ws
    ProxyPass        /api/  http://127.0.0.1:3000/api/
    ProxyPassReverse /api/  http://127.0.0.1:3000/api/
    ProxyPreserveHost On
    ProxyTimeout 3600

    # Ugyanaz a cache-politika, mint a helyi Node statikus kiszolgálójában:
    # a futó kód mindig újraérvényesül, a verziózott nagy assetek egy évig élnek.
    <FilesMatch "\.(?:html|js|mjs|css)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <FilesMatch "\.(?:json|glb|gltf|bin|png|jpe?g|webp|hdr|exr|ktx2|wasm|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    AddType model/gltf-binary .glb
    AddType model/gltf+json .gltf
    AddType application/octet-stream .bin
    AddType image/vnd.radiance .hdr
    AddType image/x-exr .exr
    AddType image/ktx2 .ktx2
    AddType application/wasm .wasm

    # A kódot és a kis szöveges fájlokat Apache tömöríti. A nagy .glb/.bin
    # fájlokat szándékosan nem: betöltéskor a CPU-idő fontosabb a pár MB-nál.
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml

    SSLCertificateFile /etc/letsencrypt/live/racing.levente.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/racing.levente.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
